# =============================================================
# CONFIGURATION IINA / MPV - OPTIMISÉE MACBOOK PRO M2 (IPTV)
# =============================================================

# --- MOTEUR & QUALITÉ DE BASE ---
# Le profil moderne remplaçant 'gpu-hq', base de toute bonne config
profile=high-quality

# Moteur graphique obligatoire pour Apple Silicon (meilleur HDR/Dolby Vision)
vo=gpu-next

# Décodage matériel : 'auto-safe' est le plus stable sur Mac
hwdec=auto-safe

# --- UPSCALING IA (Ton choix : FSRCNNX 16) ---
# Note : C'est très lourd. Si ton Mac chauffe trop ou perd des images en 4K,
# passe à la version "8-0-4-1".
glsl-shaders="~~/shaders/FSRCNNX_x2_8-0-4-1.glsl;~~/shaders/SSimSuperRes.glsl"

# Algorithmes de repli (utilisés si le shader ne s'applique pas ou pour le chroma)
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell

# --- FLUIDITÉ (INTERPOLATION) ---
# Transforme le 24fps en 60/120fps pour coller à l'écran ProMotion
# video-sync=display-resample
# interpolation=yes
# tscale=oversample

# --- COULEURS & HDR ---
# CORRECTION CRITIQUE : 'target-prim' a été retiré pour éviter les couleurs saturées.
# On laisse macOS gérer le profil P3 de l'écran.

# Meilleur algorithme actuel pour convertir le HDR vers l'écran du Mac
tone-mapping=bt.2446a
gamut-mapping-mode=perceptual
target-peak=auto

# --- NETTOYAGE IPTV (DEBANDING) ---
# Essentiel pour les flux streamés compressés. 
# Réglé plus fort (4 itérations) pour lisser les ciels et les zones sombres.
deband=yes
deband-iterations=4
deband-threshold=35
deband-range=16
deband-grain=4

# --- CACHE & STREAMING (ANTI-LAG) ---
# Force le chargement en avance pour éviter les coupures IPTV
cache=yes
# 1 Go de cache max (ok avec tes 16 Go de RAM)
demuxer-max-bytes=1024MiB
# Force le lecteur à précharger 20 secondes de vidéo minimum
demuxer-readahead-secs=20
force-seekable=yes

# --- AUDIO ---
# Optionnel : Normalisation audio si les voix sont trop faibles par rapport à l'action
af=lavfi=[dynaudnorm]


