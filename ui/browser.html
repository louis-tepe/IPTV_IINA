<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPTV Browser</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="browser-body">
    <header class="browser-header">
      <div class="search-container">
        <svg
          class="search-icon"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input
          type="text"
          id="search-input"
          class="search-input"
          data-i18n-placeholder="browser.searchPlaceholder"
          aria-label="Search"
        />
        <button
          id="search-clear"
          class="search-clear"
          hidden
          aria-label="Clear search"
        >
          ×
        </button>
      </div>
      <button
        id="refresh-btn"
        class="btn-icon"
        data-i18n-title="browser.refresh"
        aria-label="Refresh"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <polyline points="23 4 23 10 17 10" />
          <polyline points="1 20 1 14 7 14" />
          <path
            d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"
          />
        </svg>
      </button>
      <div class="language-selector">
        <button class="lang-btn" data-lang="fr" aria-label="Switch to French">
          FR
        </button>
        <button class="lang-btn" data-lang="en" aria-label="Switch to English">
          EN
        </button>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button
        class="tab active"
        data-type="live"
        role="tab"
        aria-selected="true"
        data-i18n="nav.live"
      ></button>
      <button
        class="tab"
        data-type="vod"
        role="tab"
        aria-selected="false"
        data-i18n="nav.vod"
      ></button>
      <button
        class="tab"
        data-type="series"
        role="tab"
        aria-selected="false"
        data-i18n="nav.series"
      ></button>
      <button
        class="tab"
        data-type="favorites"
        role="tab"
        aria-selected="false"
        data-i18n="nav.favorites"
      ></button>
      <button
        class="tab"
        data-type="history"
        role="tab"
        aria-selected="false"
        data-i18n="nav.history"
      ></button>
    </nav>

    <div id="breadcrumb" class="breadcrumb" hidden>
      <button
        id="back-btn"
        class="btn-back"
        data-i18n="nav.back"
        aria-label="Go back"
      ></button>
      <span id="breadcrumb-title" class="breadcrumb-title"></span>
    </div>

    <main class="browser-content">
      <div id="loading" class="loading" hidden>
        <div class="spinner"></div>
        <p data-i18n="nav.loading"></p>
      </div>
      <div id="empty" class="empty" hidden>
        <p id="empty-message" data-i18n="nav.noContent"></p>
      </div>
      <div id="list" class="content-grid"></div>
    </main>

    <footer class="browser-footer">
      <span id="server-name"></span>
      <span id="item-count"></span>
    </footer>

    <!-- Debug Panel (hidden by default - press 'D' to toggle) -->
    <div id="debug-panel" class="debug-panel" hidden>
      <div class="debug-header">
        <span class="debug-title" data-i18n="browser.debugConsole"
          >Debug Console</span
        >
        <div class="debug-controls">
          <span id="debug-msg-count" class="debug-stat"
            ><span data-i18n="browser.msgs">Msgs</span>: 0</span
          >
          <span id="debug-last-msg" class="debug-stat"
            ><span data-i18n="browser.last">Last</span>: --:--:--</span
          >
          <button
            id="debug-clear"
            class="debug-btn"
            data-i18n-title="browser.clearLogs"
          >
            Clear
          </button>
          <button
            id="debug-toggle"
            class="debug-btn"
            data-i18n-title="browser.toggleMinimize"
          >
            ▼
          </button>
        </div>
      </div>
      <div class="debug-content">
        <div id="connection-status" class="connection-status">
          ● <span data-i18n="browser.connecting">Connecting</span>
        </div>
        <div id="debug-logs" class="debug-logs"></div>
      </div>
    </div>

    <!-- Movie Details Modal -->
    <div
      id="movie-modal"
      class="movie-modal-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="movie-modal-title"
      hidden
    >
      <div class="movie-modal">
        <div class="movie-modal-header" id="movie-modal-header">
          <button
            class="movie-modal-close"
            id="movie-modal-close"
            aria-label="Close"
          >
            &times;
          </button>
        </div>
        <div class="movie-modal-content">
          <h2 class="movie-modal-title" id="movie-modal-title"></h2>
          <div class="movie-modal-meta" id="movie-modal-meta"></div>
          <p class="movie-modal-synopsis" id="movie-modal-synopsis"></p>
          <div class="movie-modal-actions">
            <button class="movie-modal-play" id="movie-modal-play">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path d="M8 5v14l11-7z" />
              </svg>
              <span data-i18n="series.play">Play</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Accessibility: Live Region for dynamic updates -->
    <div
      id="live-region"
      class="sr-only"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    <script>
      // ============================================================================
      // IPTV Browser - Sidebar Script
      // ============================================================================
      
      (function() {
        'use strict';
        
        // State
        var currentType = 'live';
        var categories = [];
        var streams = [];
        var isShowingStreams = false;
        var currentCategoryName = '';
        
        // DOM Elements
        var listEl = document.getElementById('list');
        var loadingEl = document.getElementById('loading');
        var emptyEl = document.getElementById('empty');
        var emptyMsgEl = document.getElementById('empty-message');
        var breadcrumbEl = document.getElementById('breadcrumb');
        var breadcrumbTitleEl = document.getElementById('breadcrumb-title');
        var backBtn = document.getElementById('back-btn');
        var searchInput = document.getElementById('search-input');
        var searchClear = document.getElementById('search-clear');
        var refreshBtn = document.getElementById('refresh-btn');
        var tabs = document.querySelectorAll('.tab');
        
        // Helper functions
        function showLoading() {
          loadingEl.hidden = false;
          emptyEl.hidden = true;
          listEl.innerHTML = '';
        }
        
        function hideLoading() {
          loadingEl.hidden = true;
        }
        
        function showEmpty(message) {
          hideLoading();
          emptyEl.hidden = false;
          emptyMsgEl.textContent = message || 'No content found';
          listEl.innerHTML = '';
        }
        
        function log(msg) {
          console.log('[Browser] ' + msg);
        }
        
        // Render categories
        function renderCategories(data) {
          hideLoading();
          isShowingStreams = false;
          breadcrumbEl.hidden = true;
          
          if (!data || data.length === 0) {
            showEmpty('No categories found');
            return;
          }
          
          categories = data;
          var html = data.map(function(cat) {
            var name = cat.category_name || cat.name || 'Unknown';
            var id = cat.category_id || cat.id;
            return '<div class="content-card category" data-id="' + id + '" data-name="' + name.replace(/"/g, '&quot;') + '">' +
              '<div class="card-icon">📁</div>' +
              '<div class="card-info">' +
                '<div class="card-title">' + name + '</div>' +
              '</div>' +
            '</div>';
          }).join('');
          
          listEl.innerHTML = html;
          emptyEl.hidden = true;
          
          // Add click handlers
          listEl.querySelectorAll('.category').forEach(function(el) {
            el.addEventListener('click', function() {
              var id = el.getAttribute('data-id');
              var name = el.getAttribute('data-name');
              loadStreams(id, name);
            });
          });
          
          log('Rendered ' + data.length + ' categories');
        }
        
        // Render streams
        function renderStreams(data, categoryName) {
          hideLoading();
          isShowingStreams = true;
          currentCategoryName = categoryName;
          breadcrumbEl.hidden = false;
          breadcrumbTitleEl.textContent = categoryName;
          
          if (!data || data.length === 0) {
            showEmpty('No streams in this category');
            return;
          }
          
          streams = data;
          var icon = currentType === 'live' ? '📺' : currentType === 'vod' ? '🎬' : '📚';
          
          var html = data.map(function(stream) {
            var name = stream.name || 'Unknown';
            var id = stream.stream_id || stream.series_id || stream.id;
            return '<div class="content-card stream" data-id="' + id + '" data-name="' + name.replace(/"/g, '&quot;') + '">' +
              '<div class="card-icon">' + icon + '</div>' +
              '<div class="card-info">' +
                '<div class="card-title">' + name + '</div>' +
              '</div>' +
            '</div>';
          }).join('');
          
          listEl.innerHTML = html;
          emptyEl.hidden = true;
          
          // Add click handlers
          listEl.querySelectorAll('.stream').forEach(function(el) {
            el.addEventListener('click', function() {
              var id = el.getAttribute('data-id');
              var name = el.getAttribute('data-name');
              playStream(id, name);
            });
          });
          
          log('Rendered ' + data.length + ' streams');
        }
        
        // Load categories
        function loadCategories() {
          showLoading();
          log('Requesting ' + currentType + ' categories');
          
          if (typeof iina !== 'undefined' && iina.postMessage) {
            iina.postMessage('getCategories', { type: currentType });
          } else {
            showEmpty('Plugin not connected');
          }
        }
        
        // Load streams for a category
        function loadStreams(categoryId, categoryName) {
          showLoading();
          log('Requesting streams for category: ' + categoryId);
          
          if (typeof iina !== 'undefined' && iina.postMessage) {
            iina.postMessage('getStreams', {
              type: currentType,
              categoryId: categoryId,
              categoryName: categoryName
            });
          }
        }
        
        // Play a stream
        function playStream(id, name) {
          log('Playing: ' + name + ' (id=' + id + ')');
          
          if (typeof iina !== 'undefined' && iina.postMessage) {
            iina.postMessage('play', {
              id: id,
              name: name,
              type: currentType
            });
          }
        }
        
        // Handle back button
        if (backBtn) {
          backBtn.addEventListener('click', function() {
            loadCategories();
          });
        }
        
        // Handle tab switching
        tabs.forEach(function(tab) {
          tab.addEventListener('click', function() {
            tabs.forEach(function(t) { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
            tab.classList.add('active');
            tab.setAttribute('aria-selected', 'true');
            currentType = tab.getAttribute('data-type');
            loadCategories();
          });
        });
        
        // Handle refresh
        if (refreshBtn) {
          refreshBtn.addEventListener('click', function() {
            if (isShowingStreams) {
              // Reload streams - we don't have the ID saved, go back to categories
              loadCategories();
            } else {
              loadCategories();
            }
          });
        }
        
        // Handle search
        if (searchInput) {
          searchInput.addEventListener('input', function(e) {
            var query = e.target.value.toLowerCase();
            searchClear.hidden = !query;
            
            listEl.querySelectorAll('.content-card').forEach(function(card) {
              var name = card.getAttribute('data-name') || '';
              card.style.display = name.toLowerCase().indexOf(query) >= 0 ? '' : 'none';
            });
          });
        }
        
        if (searchClear) {
          searchClear.addEventListener('click', function() {
            searchInput.value = '';
            searchClear.hidden = true;
            listEl.querySelectorAll('.content-card').forEach(function(card) {
              card.style.display = '';
            });
          });
        }
        
        // Message handler from plugin
        if (typeof iina !== 'undefined' && iina.onMessage) {
          iina.onMessage('categories', function(data) {
            log('Received categories: ' + (data ? data.length : 0));
            renderCategories(data);
          });
          
          iina.onMessage('streams', function(data) {
            log('Received streams');
            renderStreams(data.streams, data.categoryName);
          });
          
          iina.onMessage('init', function(data) {
            log('Init received, configured: ' + (data ? data.configured : false));
            if (data && data.configured) {
              loadCategories();
            } else {
              showEmpty('Please configure your IPTV server first');
            }
          });
          
          iina.onMessage('error', function(data) {
            log('Error: ' + (data ? data.message : 'Unknown'));
            showEmpty(data ? data.message : 'An error occurred');
          });
          
          // HTTP Proxy: Handle API requests from plugin (bypasses ATS)
          // WebViews can make HTTP requests without ATS blocking
          iina.onMessage('api_request', function(data) {
            log('API request received: ' + data.requestId);
            var requestId = data.requestId;
            var url = data.url;
            
            fetch(url, {
              method: 'GET',
              headers: {
                'Accept': 'application/json'
              }
            })
            .then(function(response) {
              log('Fetch response status: ' + response.status);
              return response.text().then(function(text) {
                return {
                  statusCode: response.status,
                  text: text,
                  ok: response.ok
                };
              });
            })
            .then(function(result) {
              log('Sending api_response: ' + result.statusCode);
              iina.postMessage('api_response', {
                requestId: requestId,
                success: true,
                statusCode: result.statusCode,
                text: result.text
              });
            })
            .catch(function(err) {
              log('Fetch error: ' + err.message);
              iina.postMessage('api_response', {
                requestId: requestId,
                success: false,
                error: err.message || String(err)
              });
            });
          });
        }
        
        // Initialize - signal ready to plugin
        document.addEventListener('DOMContentLoaded', function() {
          log('Browser loaded, sending ready signal');
          if (typeof iina !== 'undefined' && iina.postMessage) {
            iina.postMessage('ready', {});
          }
        });
        
        // Also try immediately in case DOMContentLoaded already fired
        if (document.readyState !== 'loading') {
          log('Document already ready, sending ready signal');
          if (typeof iina !== 'undefined' && iina.postMessage) {
            iina.postMessage('ready', {});
          }
        }
      })();
    </script>
  </body>
</html>
