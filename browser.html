<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPTV Browser</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      padding: var(--spacing-md);
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
    }

    .search-container {
      flex: 1;
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      padding: var(--spacing-sm) var(--spacing-md);
      background: var(--bg-tertiary);
      border-radius: var(--radius-md);
    }

    .search-icon {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    #search-input {
      flex: 1;
      background: transparent;
      border: none;
      font-size: 13px;
    }

    #search-clear {
      font-size: 18px;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    /* Breadcrumb */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      padding: var(--spacing-sm) var(--spacing-md);
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
    }

    .btn-back {
      display: flex;
      align-items: center;
      gap: var(--spacing-xs);
      padding: var(--spacing-xs) var(--spacing-sm);
      font-size: 13px;
      color: var(--accent);
      background: var(--accent-light);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }

    .btn-back:hover {
      background: rgba(0, 122, 255, 0.25);
    }

    .breadcrumb-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
    }

    /* Content */
    .content {
      flex: 1;
      overflow-y: auto;
    }

    .content-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: var(--spacing-md);
      padding: var(--spacing-md);
    }

    /* Header with Glassmorphism */
.header {
  display: flex;
  align-items: center;
  gap: var(--spacing-sm);
  padding: var(--spacing-md);
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border-bottom: 1px solid var(--glass-border);
  position: sticky;
  top: 0;
  z-index: 100;
}

.search-container {
  flex: 1;
  display: flex;
  align-items: center;
  gap: var(--spacing-sm);
  padding: var(--spacing-sm) var(--spacing-md);
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  transition: all var(--transition-fast);
}

.search-container:focus-within {
  background: var(--bg-secondary);
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-light);
}

/* Tabs */
.tabs {
  display: flex;
  gap: var(--spacing-sm);
  padding: var(--spacing-sm) var(--spacing-md);
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border-bottom: 1px solid var(--glass-border);
  position: sticky;
  top: 57px; /* Height of header */
  z-index: 90;
}

.tab {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-xs);
  padding: var(--spacing-sm) var(--spacing-md);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all var(--transition-fast);
}

.tab:hover {
  color: var(--text-primary);
  background: var(--bg-hover);
}

.tab.active {
  color: #fff;
  background: var(--accent-gradient);
  box-shadow: var(--accent-glow);
  border-color: transparent;
}

/* Stream Card */
.stream-card {
  display: flex;
  flex-direction: column;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  cursor: pointer;
  transition: all var(--transition-normal);
  animation: fadeIn 0.5s ease backwards;
}

.stream-card:hover {
  border-color: var(--accent);
  transform: translateY(-4px) scale(1.02);
  box-shadow: var(--shadow-lg), var(--accent-glow);
  z-index: 1;
}

.stream-card:focus-visible {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}

.stream-poster {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  background: var(--bg-tertiary);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.stream-poster img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform var(--transition-normal);
}

.stream-card:hover .stream-poster img {
  transform: scale(1.05);
}

/* Favorite Button */
.stream-favorite {
  position: absolute;
  top: var(--spacing-xs);
  right: var(--spacing-xs);
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 50%;
  cursor: pointer;
  opacity: 0;
  transform: scale(0.8);
  transition: all var(--transition-fast);
}

.stream-card:hover .stream-favorite,
.stream-favorite.active {
  opacity: 1;
  transform: scale(1);
}

.stream-favorite:hover {
  background: rgba(0, 0, 0, 0.6);
  transform: scale(1.1);
}

    .stream-info {
      padding: var(--spacing-sm);
    }

    .stream-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .stream-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--spacing-sm) var(--spacing-md);
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="search-container">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="search-input" placeholder="Search channels, movies, series...">
      <button id="search-clear" hidden>×</button>
    </div>
    <button id="refresh-btn" class="btn-icon" title="Refresh (R)" accesskey="r">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="23 4 23 10 17 10"/>
        <polyline points="1 20 1 14 7 14"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
    </button>
    <button id="disconnect-btn" class="btn-icon" title="Disconnect">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
  </header>

  <!-- Tabs -->
  <nav class="tabs">
    <button class="tab active" data-type="live">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="7" width="20" height="15" rx="2" ry="2"/>
        <polyline points="17 2 12 7 7 2"/>
      </svg>
      Live TV
    </button>
    <button class="tab" data-type="vod">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/>
        <line x1="7" y1="2" x2="7" y2="22"/>
        <line x1="17" y1="2" x2="17" y2="22"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
      </svg>
      Movies
    </button>
    <button class="tab" data-type="series">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 11a9 9 0 0 1 9 9"/>
        <path d="M4 4a16 16 0 0 1 16 16"/>
        <circle cx="5" cy="19" r="1"/>
      </svg>
      Series
    </button>
    <button class="tab" data-type="favorites">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
      Favorites
    </button>
    <button class="tab" data-type="history">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      History
    </button>
  </nav>

  <!-- Breadcrumb (shown when in category) -->
  <div id="breadcrumb" class="breadcrumb" hidden>
    <button id="back-btn" class="btn-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
      Back
    </button>
    <span id="breadcrumb-title" class="breadcrumb-title"></span>
  </div>

  <!-- Content -->
  <main class="content">
    <div id="loading" class="loading" hidden>
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>

    <div id="empty" class="empty" hidden>
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <p id="empty-message">No content available</p>
    </div>

    <div id="list" class="content-grid"></div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <span id="server-name">Connected</span>
    <span id="item-count"></span>
  </footer>

  <!-- EPG Modal -->
  <div id="epg-modal" class="modal" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <h3>Program Guide</h3>
        <button id="epg-close" class="btn-icon">&times;</button>
      </div>
      <div id="epg-content" class="modal-body">
        <!-- EPG content loaded here -->
      </div>
    </div>
  </div>

  <!-- Debug Panel - Always Visible -->
  <div id="debug-panel" class="debug-panel">
    <div class="debug-header">
      <span class="debug-title">🔧 Debug Console</span>
      <div class="debug-controls">
        <span id="connection-status" class="connection-status">● Connecting</span>
        <button id="debug-clear" class="debug-btn" title="Clear">🗑️</button>
        <button id="debug-toggle" class="debug-btn" title="Minimize/Expand">▼</button>
      </div>
    </div>
    <div id="debug-content" class="debug-content">
      <div id="debug-logs" class="debug-logs"></div>
      <div class="debug-stats">
        <span id="debug-msg-count">Msgs: 0</span>
        <span id="debug-last-msg">Last: --</span>
      </div>
    </div>
  </div>

  <!-- Debug Panel Styles -->
  <style>
    .debug-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.95);
      border-top: 2px solid #0f0;
      z-index: 9999;
      font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
      font-size: 11px;
      color: #0f0;
      display: flex;
      flex-direction: column;
      max-height: 200px;
    }
    
    .debug-panel.minimized {
      max-height: 28px;
    }
    
    .debug-panel.minimized .debug-content {
      display: none;
    }
    
    .debug-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 10px;
      background: rgba(0, 50, 0, 0.5);
      border-bottom: 1px solid #0f0;
      cursor: pointer;
      user-select: none;
    }
    
    .debug-title {
      font-weight: bold;
      color: #0f0;
    }
    
    .debug-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .connection-status {
      font-size: 10px;
      color: #ff0;
    }
    
    .connection-status.connected {
      color: #0f0;
    }
    
    .connection-status.error {
      color: #f00;
    }
    
    .debug-btn {
      background: transparent;
      border: 1px solid #0f0;
      color: #0f0;
      padding: 2px 6px;
      cursor: pointer;
      font-size: 10px;
      border-radius: 3px;
    }
    
    .debug-btn:hover {
      background: rgba(0, 255, 0, 0.2);
    }
    
    .debug-content {
      display: flex;
      flex-direction: column;
      height: 170px;
    }
    
    .debug-logs {
      flex: 1;
      overflow-y: auto;
      padding: 5px 10px;
      line-height: 1.4;
    }
    
    .debug-logs::-webkit-scrollbar {
      width: 6px;
    }
    
    .debug-logs::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
    }
    
    .debug-logs::-webkit-scrollbar-thumb {
      background: #0f0;
      border-radius: 3px;
    }
    
    .debug-log-entry {
      margin-bottom: 2px;
      word-break: break-all;
    }
    
    .debug-log-entry.error {
      color: #f55;
    }
    
    .debug-log-entry.warn {
      color: #ff5;
    }
    
    .debug-log-entry.info {
      color: #5ff;
    }
    
    .debug-log-entry.sent {
      color: #f5f;
    }
    
    .debug-log-entry.received {
      color: #5f5;
    }
    
    .debug-log-timestamp {
      color: #888;
      font-size: 9px;
    }
    
    .debug-stats {
      display: flex;
      gap: 15px;
      padding: 3px 10px;
      background: rgba(0, 50, 0, 0.3);
      border-top: 1px solid #0f0;
      font-size: 9px;
      color: #aaa;
    }
    
    /* Adjust main content to not overlap debug panel */
    .content {
      padding-bottom: 200px;
    }
  </style>

  <!-- EPG Modal Styles -->
  <style>
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-lg);
    }
    
    .modal-content {
      background: var(--bg-secondary);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 500px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }
    
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--spacing-md) var(--spacing-lg);
      border-bottom: 1px solid var(--border);
    }
    
    .modal-header h3 {
      font-size: 16px;
      font-weight: 600;
    }
    
    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: var(--spacing-md);
    }
    
    .epg-list {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }
    
    .epg-item {
      padding: var(--spacing-sm);
      background: var(--bg-tertiary);
      border-radius: var(--radius-md);
    }
    
    .epg-time {
      font-size: 11px;
      color: var(--accent);
      font-weight: 500;
    }
    
    .epg-title {
      font-size: 13px;
      font-weight: 500;
      margin-top: 2px;
    }
    
    .epg-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    
    .epg-loading, .epg-empty, .epg-error {
      text-align: center;
      padding: var(--spacing-xl);
      color: var(--text-muted);
    }
    
    .epg-error-detail {
      font-size: 12px;
      color: var(--danger);
      margin-top: var(--spacing-sm);
    }
    
    .stream-epg-btn {
      position: absolute;
      bottom: var(--spacing-xs);
      left: var(--spacing-xs);
      padding: 2px 6px;
      font-size: 9px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }
    
    .stream-type-badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 9px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-light);
      border-radius: var(--radius-sm);
      margin-top: 4px;
    }
    
    /* Issue 5: Episode quality badge styles */
    .episode-quality {
      position: absolute;
      bottom: var(--spacing-xs);
      right: var(--spacing-xs);
      padding: 2px 6px;
      font-size: 9px;
      font-weight: 600;
      color: #fff;
      background: rgba(0, 0, 0, 0.7);
      border-radius: var(--radius-sm);
      text-transform: uppercase;
    }
    
    .episode-quality-badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 9px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-light);
      border-radius: var(--radius-sm);
      margin-top: 4px;
    }
    
    /* Issue 2: Enhanced history card styles */
    .history-card {
      display: flex;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .history-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    
    .history-thumbnail {
      width: 120px;
      flex-shrink: 0;
      background: var(--bg-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .history-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .history-thumbnail svg {
      color: var(--text-muted);
    }
    
    .history-info {
      flex: 1;
      padding: var(--spacing-sm);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    .history-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    
    .history-meta {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: var(--spacing-xs);
    }
    
    .history-timestamp {
      font-size: 10px;
      color: var(--text-muted);
    }
    
    .history-resume-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      font-size: 9px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border-radius: var(--radius-sm);
      margin-top: 4px;
    }
  </style>

  <script src="browser.js"></script>
</body>
</html>
