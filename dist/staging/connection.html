<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPTV Connection</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .connection-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--spacing-xl);
    }

    .connection-container {
      width: 100%;
      max-width: 320px;
    }

    .logo {
      text-align: center;
      margin-bottom: var(--spacing-xl);
      color: var(--accent);
    }

    .logo svg {
      width: 64px;
      height: 64px;
    }

    .logo h1 {
      font-size: 20px;
      font-weight: 600;
      margin-top: var(--spacing-md);
      color: var(--text-primary);
    }

    .form-group {
      margin-bottom: var(--spacing-md);
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: var(--spacing-xs);
    }

    .btn-primary {
      margin-top: var(--spacing-lg);
    }

    .btn-loading {
      display: none;
    }

    .btn-primary.loading .btn-text {
      display: none;
    }

    .btn-primary.loading .btn-loading {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary.loading .btn-loading::before {
      content: '';
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .error-message {
      margin-top: var(--spacing-md);
      padding: var(--spacing-sm) var(--spacing-md);
      background: rgba(255, 59, 48, 0.1);
      border: 1px solid var(--danger);
      border-radius: var(--radius-md);
      color: var(--danger);
      font-size: 12px;
      text-align: center;
    }

    .server-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: var(--spacing-xs);
    }

    .remember-me-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      margin-top: var(--spacing-sm);
      user-select: none;
    }

    .remember-me-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .remember-me-label input[type="checkbox"]:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="connection-screen">
    <div class="connection-container">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="7" width="20" height="15" rx="2" ry="2"/>
          <polyline points="17 2 12 7 7 2"/>
        </svg>
        <h1>IPTV Player</h1>
      </div>

      <form id="connection-form">
        <div class="form-group">
          <label for="server">Server URL</label>
          <input type="url" id="server" placeholder="http://example.com:8080" required>
          <p class="server-hint">Include the port number (e.g., :8080)</p>
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Your username" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Your password" required>
        </div>

        <div class="form-group">
          <label class="remember-me-label">
            <input type="checkbox" id="rememberMe" checked>
            <span>Remember me on this computer</span>
          </label>
        </div>

        <button type="submit" id="connectBtn" class="btn btn-primary">
          <span class="btn-text">Connect</span>
          <span class="btn-loading">Connecting...</span>
        </button>

        <div id="error" class="error-message" hidden></div>
      </form>
    </div>
  </div>

  <script>
    (function() {
      var form = document.getElementById('connection-form');
      var serverInput = document.getElementById('server');
      var usernameInput = document.getElementById('username');
      var passwordInput = document.getElementById('password');
      var rememberMeCheckbox = document.getElementById('rememberMe');
      var connectBtn = document.getElementById('connectBtn');
      var errorDiv = document.getElementById('error');

      // Handle init message with saved credentials
      if (window.iina && iina.onMessage) {
        iina.onMessage('init', function(data) {
          if (data) {
            if (data.server) serverInput.value = data.server;
            if (data.username) usernameInput.value = data.username;
            if (data.password) passwordInput.value = data.password;
            // Set checkbox state based on saved preference
            if (data.rememberMe !== undefined) {
              rememberMeCheckbox.checked = data.rememberMe;
            }
          }
        });
      }

      // Issue 1: Handle auto-connect message
      if (window.iina && iina.onMessage) {
        iina.onMessage('autoConnect', function(data) {
          if (data && data.server && data.username && data.password) {
            console.log('[Connection] Auto-connecting with saved credentials...');
            errorDiv.hidden = true;
            connectBtn.classList.add('loading');
            connectBtn.disabled = true;
            
            if (window.iina && iina.postMessage) {
              iina.postMessage('connect', {
                server: data.server,
                username: data.username,
                password: data.password,
                rememberMe: data.rememberMe !== false // Default to true
              });
            }
          }
        });
      }

      // Handle error message
      if (window.iina && iina.onMessage) {
        iina.onMessage('error', function(message) {
          connectBtn.classList.remove('loading');
          connectBtn.disabled = false;
          errorDiv.textContent = message || 'Connection failed. Please check your credentials.';
          errorDiv.hidden = false;
        });
      }

      // Handle success (transition to browser)
      if (window.iina && iina.onMessage) {
        iina.onMessage('success', function() {
          connectBtn.classList.remove('loading');
        });
      }

      // Form submission
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        var server = serverInput.value.trim();
        var username = usernameInput.value.trim();
        var password = passwordInput.value.trim();
        var rememberMe = rememberMeCheckbox.checked;

        if (!server || !username || !password) {
          errorDiv.textContent = 'Please fill in all fields.';
          errorDiv.hidden = false;
          return;
        }

        // Add http:// if missing
        if (server.indexOf('http') !== 0) {
          server = 'http://' + server;
          serverInput.value = server;
        }

        // Hide error, show loading
        errorDiv.hidden = true;
        connectBtn.classList.add('loading');
        connectBtn.disabled = true;

        // Send connect message with rememberMe flag
        if (window.iina && iina.postMessage) {
          iina.postMessage('connect', {
            server: server,
            username: username,
            password: password,
            rememberMe: rememberMe
          });
        }
      });

      // Notify ready
      if (window.iina && iina.postMessage) {
        iina.postMessage('ready');
      }
    })();
  </script>
</body>
</html>
