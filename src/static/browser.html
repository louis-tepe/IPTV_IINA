<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPTV Browser</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="search-container">
        <svg
          class="search-icon"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input
          type="text"
          id="search-input"
          placeholder="Search channels, movies, series..."
        />
        <button id="search-clear" hidden>×</button>
      </div>
      <button
        id="refresh-btn"
        class="btn-icon"
        title="Refresh (R)"
        accesskey="r"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <polyline points="23 4 23 10 17 10" />
          <polyline points="1 20 1 14 7 14" />
          <path
            d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"
          />
        </svg>
      </button>
      <button id="disconnect-btn" class="btn-icon" title="Disconnect">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </button>
    </header>

    <!-- Tabs -->
    <nav class="tabs">
      <button class="tab active" data-type="live">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="2" y="7" width="20" height="15" rx="2" ry="2" />
          <polyline points="17 2 12 7 7 2" />
        </svg>
        Live TV
      </button>
      <button class="tab" data-type="vod">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18" />
          <line x1="7" y1="2" x2="7" y2="22" />
          <line x1="17" y1="2" x2="17" y2="22" />
          <line x1="2" y1="12" x2="22" y2="12" />
        </svg>
        Movies
      </button>
      <button class="tab" data-type="series">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M4 11a9 9 0 0 1 9 9" />
          <path d="M4 4a16 16 0 0 1 16 16" />
          <circle cx="5" cy="19" r="1" />
        </svg>
        Series
      </button>
      <button class="tab" data-type="favorites">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
          />
        </svg>
        Favorites
      </button>
      <button class="tab" data-type="history">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
        History
      </button>
    </nav>

    <!-- Breadcrumb (shown when in category) -->
    <div id="breadcrumb" class="breadcrumb" hidden>
      <button id="back-btn" class="btn-back">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
        Back
      </button>
      <span id="breadcrumb-title" class="breadcrumb-title"></span>
    </div>

    <!-- Content -->
    <main class="content">
      <div id="loading" class="loading" hidden>
        <div class="spinner"></div>
        <p>Loading...</p>
      </div>

      <div id="empty" class="empty" hidden>
        <svg
          width="48"
          height="48"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1"
        >
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <p id="empty-message">No content available</p>
      </div>

      <div id="list" class="content-grid"></div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span id="server-name">Connected</span>
      <span id="item-count"></span>
    </footer>

    <!-- EPG Modal -->
    <div id="epg-modal" class="modal" hidden>
      <div class="modal-content">
        <div class="modal-header">
          <h3>Program Guide</h3>
          <button id="epg-close" class="btn-icon">&times;</button>
        </div>
        <div id="epg-content" class="modal-body">
          <!-- EPG content loaded here -->
        </div>
      </div>
    </div>

    <!-- Debug Panel - Always Visible -->
    <div id="debug-panel" class="debug-panel">
      <div class="debug-header">
        <span class="debug-title">🔧 Debug Console</span>
        <div class="debug-controls">
          <span id="connection-status" class="connection-status"
            >● Connecting</span
          >
          <button id="debug-clear" class="debug-btn" title="Clear">🗑️</button>
          <button id="debug-toggle" class="debug-btn" title="Minimize/Expand">
            ▼
          </button>
        </div>
      </div>
      <div id="debug-content" class="debug-content">
        <div id="debug-logs" class="debug-logs"></div>
        <div class="debug-stats">
          <span id="debug-msg-count">Msgs: 0</span>
          <span id="debug-last-msg">Last: --</span>
        </div>
      </div>
    </div>

    <script src="browser.js"></script>
  </body>
</html>
